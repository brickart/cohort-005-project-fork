<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { margin: 0; padding: 0; background: #f4f4f5; font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #18181b; }
      .container { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
      .wordmark { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 24px; }
      .card { background: #ffffff; border-radius: 8px; padding: 32px; font-size: 15px; line-height: 1.6; }
      .card p { margin: 0 0 16px; }
      .signoff { margin: 24px 0 0; }
      .footer { margin: 24px 0 0; font-size: 12px; line-height: 1.5; color: #71717a; }
    </style>
  </head>
  <body>
    <div class="container">
      <p class="wordmark">Cadence</p>
      <div class="card">
        {{ content }}
        <p class="signoff">— The Cadence team</p>
      </div>
      <p class="footer">
        We always send this email because it's about something you did.
      </p>
    </div>
  </body>
</html>
